id: simple-voice-chat
name: Simple Voice Chat
description: >-
  Proximity voice add-on for Minecraft Java. Runs its own UDP listener
  alongside the game port, which is why it needs to be attached to the same
  subdomain as the server it belongs to.
addon: true
ports:
  - id: voice
    label: Voice (UDP)
    protocol: udp
    default_port: 24454
    # The server tells clients where to reach voice via `voice_host`, so the
    # edge port does not have to match the local one. That is what allows more
    # than one voice-enabled server per public IP.
    edge_port_fixed: false
    server_config:
      file: plugins/voicechat/voicechat-server.properties
      key: voice_host
      value_template: "{host}:{edge_port}"
      explanation: >-
        Without this, the server advertises its own LAN address and clients
        show the red "disconnected" plug icon. On Fabric/NeoForge/Forge the
        file lives at config/voicechat/voicechat-server.properties instead.

notes:
  - >-
    Voice traffic is UDP and latency-sensitive; it shares the tunnel with game
    traffic, so a saturated home uplink shows up as choppy audio first.
  - >-
    `voice_host` only changes what the server advertises. The `port` key in the
    same file still controls what it binds locally, and the two are set
    independently.
