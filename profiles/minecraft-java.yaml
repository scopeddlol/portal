id: minecraft-java
name: Minecraft (Java Edition)
description: >-
  Vanilla, Paper, Fabric, Forge and friends. Java clients follow SRV records,
  so players can connect with a bare hostname even when the edge port is not
  25565.
ports:
  - id: game
    label: Game
    protocol: tcp
    default_port: 25565
    srv:
      service: _minecraft
      proto: _tcp
      priority: 0
      weight: 5

  - id: query
    label: Query (server list pings from third-party tools)
    protocol: udp
    default_port: 25565
    optional: true

  - id: rcon
    label: RCON
    protocol: tcp
    default_port: 25575
    optional: true

notes:
  - >-
    Exposing RCON publicly gives anyone with the password full console access.
    Leave it off unless you know you need it, and never reuse a password.
  - >-
    Set `server-ip=` (blank) and `online-mode=true` in server.properties. The
    server sees connections arriving from the tunnel address, not the player's
    real IP, unless you enable a proxy protocol on both ends.
