# Portal gateway — run this on your rented server (the one with a public IP).
#
# Needs two files beside it: config.toml and .env. Nothing else — no clone, no
# build. See https://github.com/scopeddlol/portal#setup
#
#   docker compose up -d
#
# network_mode: host is not laziness. The gateway writes nftables rules and
# drives a WireGuard interface in the host's network namespace; a bridged
# container would program a namespace no player can reach.
#
# One thing this file cannot do for you: enable IP forwarding. Docker refuses
# namespaced network sysctls when a container shares the host's netns, so run
# this once on the host or DNAT silently drops every game packet:
#
#   echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-portal.conf
#   sudo sysctl --system

services:
  gateway:
    image: ghcr.io/scopeddlol/portal-gateway:beta
    container_name: portal-gateway
    restart: unless-stopped
    network_mode: host
    cap_add:
      # For nftables and WireGuard. NET_RAW is not needed: the gateway never
      # touches a packet itself.
      - NET_ADMIN
    volumes:
      # Holds the database and the gateway's WireGuard key. Both are state —
      # lose this volume and every enrolled agent has to be re-enrolled.
      - portal-data:/var/lib/portal
      - ./config.toml:/etc/portal/config.toml:ro
    env_file:
      # Secrets stay out of config.toml, which is the file people paste into
      # forum posts when asking why their ports do not work.
      - .env
    environment:
      - RUST_LOG=portal_gateway=info

  # HTTPS for the control panel. The agent at home has to reach the API over
  # the internet, and the admin token controls your DNS, so it cannot travel in
  # the clear. Caddy gets and renews the certificate by itself.
  #
  # Host networking here too, so it can reach the gateway on 127.0.0.1:8080.
  caddy:
    image: caddy:2-alpine
    container_name: portal-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  portal-data:
  caddy-data:
  caddy-config:
