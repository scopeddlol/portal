# Portal gateway — runs on the rented server with the public IP.
#
# Expects config.toml and .env alongside it. See
# https://github.com/scopeddlol/portal#setup
#
#   docker compose up -d
#
# network_mode: host is not laziness. The gateway writes nftables rules and
# drives a WireGuard interface in the host's network namespace; a bridged
# container would program a namespace no player can reach.
#
# IP forwarding cannot be set here: Docker refuses namespaced network sysctls
# when a container shares the host's netns. Run this once on the host, or DNAT
# drops every forwarded packet:
#
#   echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-portal.conf
#   sudo sysctl --system

services:
  gateway:
    image: ghcr.io/scopeddlol/portal-gateway:beta
    container_name: portal-gateway
    restart: unless-stopped
    network_mode: host
    cap_add:
      # For nftables and WireGuard. NET_RAW is not needed: the gateway never
      # touches a packet itself.
      - NET_ADMIN
    volumes:
      # Holds the database and the gateway's WireGuard key. Both are state;
      # losing this volume invalidates every node.
      - portal-data:/var/lib/portal
      - ./config.toml:/etc/portal/config.toml:ro
    env_file:
      # Secrets stay out of config.toml, which is the file most likely to be
      # pasted into a forum post.
      - .env
    environment:
      - RUST_LOG=portal_gateway=info

  # HTTPS for the control panel. The agent reaches the API over the internet
  # and the admin token controls the whole DNS zone, so it cannot travel in the
  # clear. Caddy obtains and renews the certificate on its own.
  #
  # Host networking here too, so it can reach the gateway on 127.0.0.1:8080.
  caddy:
    image: caddy:2-alpine
    container_name: portal-caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  portal-data:
  caddy-data:
  caddy-config:
