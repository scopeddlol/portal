# Portal agent — run this at home, next to your game servers.
#
# Enroll once before starting it, using a token from the gateway's web page:
#
#   docker compose -f agent-compose.yml run --rm agent \
#     enroll --gateway https://portal.example.com --token <token> --name my-pc
#
#   docker compose -f agent-compose.yml up -d
#
# The agent dials out and is never dialled, so no port forward is needed here.

services:
  agent:
    image: ghcr.io/scopeddlol/portal-agent:beta
    container_name: portal-agent
    restart: unless-stopped
    # Host networking so 127.0.0.1 means the machine your game servers are on.
    # If they run in other containers, remove this and set a local port
    # override per service instead.
    network_mode: host
    cap_add:
      # Needed to create the WireGuard interface. This is the requirement the
      # userspace tunnel backend is meant to remove, once it exists.
      - NET_ADMIN
    volumes:
      # Holds this agent's identity and key. Lose it and you re-enroll.
      - agent-data:/var/lib/portal-agent
    environment:
      - RUST_LOG=portal_agent_core=info

volumes:
  agent-data:
