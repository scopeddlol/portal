# Portal agent — run this at home, next to your servers.
#
# Two values and you're done. Get them from the control panel: add a node, and
# it shows you the key.
#
#   docker compose -f agent-compose.yml up -d
#
# The agent keeps no state. It makes a fresh tunnel key every start and tells
# the gateway about it, so there is nothing to back up and no volume to lose.
# One agent reaches every machine on the network it sits in, so ten servers
# need one of these, not ten.

services:
  agent:
    image: ghcr.io/scopeddlol/portal-agent:beta
    container_name: portal-agent
    restart: unless-stopped
    # Host networking so the agent can reach the rest of your LAN.
    network_mode: host
    cap_add:
      # Needed to create the WireGuard interface. This is the requirement the
      # userspace tunnel backend is meant to remove, once it exists.
      - NET_ADMIN
    environment:
      PORTAL_URL: https://portal.yourdomain.com
      PORTAL_KEY: paste-the-key-from-the-control-panel
