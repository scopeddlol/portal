# Portal agent — runs on the private network holding the servers.
#
# Two values, both issued by the control panel when a node is added:
#
#   docker compose -f agent-compose.yml up -d
#
# The agent keeps no state. It generates a fresh tunnel key on each start and
# registers it, so there is no volume to preserve. One agent reaches every
# machine on the network it sits in.

services:
  agent:
    image: ghcr.io/scopeddlol/portal-agent:beta
    container_name: portal-agent
    restart: unless-stopped
    # Host networking so the agent can reach the rest of the network.
    network_mode: host
    cap_add:
      # Required to create the WireGuard interface.
      - NET_ADMIN
    environment:
      PORTAL_URL: https://portal.example.com
      PORTAL_KEY: paste-the-key-from-the-control-panel
