# Build the gateway from source instead of pulling the published image.
#
# For development. compose.yml pulls the published images instead and needs
# neither a clone nor a toolchain.
#
#   docker compose -f compose.build.yml up -d --build
#
# IP forwarding has to be enabled on the host, not here — Docker refuses
# namespaced network sysctls when a container shares the host's netns:
#
#   echo 'net.ipv4.ip_forward=1' | sudo tee /etc/sysctl.d/99-portal.conf
#   sudo sysctl --system

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: gateway
    container_name: portal-gateway
    restart: unless-stopped
    network_mode: host
    cap_add:
      # NET_ADMIN for nftables and WireGuard. NET_RAW is not needed: the
      # gateway never touches a packet itself.
      - NET_ADMIN
    volumes:
      - portal-data:/var/lib/portal
      - ./config.toml:/etc/portal/config.toml:ro
    environment:
      # Secrets stay out of config.toml. deploy/.env is gitignored, or supply
      # them from an external secret store.
      - PORTAL_CF_API_TOKEN=${PORTAL_CF_API_TOKEN}
      - PORTAL_ADMIN_TOKEN=${PORTAL_ADMIN_TOKEN}
      - RUST_LOG=portal_gateway=info

volumes:
  portal-data:
